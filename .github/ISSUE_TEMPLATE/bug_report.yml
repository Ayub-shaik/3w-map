name: Bug report
description: Something in pmap, the exporter or the docs is wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: What you did, what you expected, what you saw }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce, description: Commands and a minimal nodes.jsonl if relevant }
  - type: input
    id: env
    attributes: { label: Environment, placeholder: "OS, Python version, git version" }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed secrets and private repository content from this report
          required: true
