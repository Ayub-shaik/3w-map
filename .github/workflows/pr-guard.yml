name: pr-guard
# Runs with pull_request_target so it can comment on pull requests from forks. It never checks out or runs the pull request's code: it only reads metadata through the API.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
permissions:
  pull-requests: write
  issues: write
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const maint = ["OWNER", "MEMBER", "COLLABORATOR"].includes(pr.author_association);
            const say = (body) => github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            const close = () => github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: "closed" });

            // 1. Branch name: feature/..., bug/... or docs/... (never main) -- contributors only
            const head = pr.head.ref;
            if (!maint && !/^(feature|bug|docs)\/[a-z0-9][a-z0-9-]*$/.test(head)) {
              await say(`Thanks for the pull request. Please use a branch named \`feature/<name>\`, \`bug/<name>\` or \`docs/<name>\` (lowercase, digits, hyphens), created from \`main\`. This one is \`${head}\`. See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md#workflow-fork-branch-pull-request). Closing; please reopen from a correctly named branch.`);
              await close();
              core.setFailed("branch name"); return;
            }

            // 2. At most 3 open pull requests per contributor
            if (!maint && context.payload.action === "opened") {
              const open = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 });
              const mine = open.filter(p => p.user.login === pr.user.login);
              if (mine.length > 3) {
                await say(`You already have ${mine.length - 1} open pull requests; the limit is 3 so reviews stay manageable. Please finish or close one and reopen this. See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md#pull-request-limits).`);
                await close();
                core.setFailed("open pull request limit"); return;
              }
            }

            // 3. Developer Certificate of Origin: every commit signed off
            const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: pr.number, per_page: 100 });
            const unsigned = commits.filter(c => !/^Signed-off-by: .+ <.+>/m.test(c.commit.message) && c.parents.length < 2);
            if (!maint && unsigned.length) {
              core.setFailed(`${unsigned.length} commit(s) lack a Signed-off-by line. Use git commit -s (or git rebase --signoff main).`);
            }
